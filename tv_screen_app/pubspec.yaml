name: playzone_tv
description: >-
  PlayZone wall-screen app: a Flutter Web build that runs *on* the wall
  televisions (packaged as a webOS .ipk for the LG walls, an APK for the
  Android/ATA one). It pulls the live board from the till's picture server
  over the LAN and paints it natively — no DLNA push, no hand-back.
publish_to: "none"
version: 1.0.0

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

flutter:
  uses-material-design: true
